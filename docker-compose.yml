# Synology Container Manager / docker compose
# MySQL 用现有库（NAS 上 mysql8 容器，宿主机 127.0.0.1:13506 -> 3306）
# 桥接网络 + ports 映射保持外网可访问；MySQL 经 host.docker.internal 访问宿主机（等效 127.0.0.1）
services:
  spiderman:
    build: .
    image: spiderman-ledger:local
    pull_policy: build
    container_name: spiderman_ledger
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: "Asia/Shanghai"
      LEDGER_HOST: "0.0.0.0"
      LEDGER_PORT: "8765"
      CRAWL_CRON_HOURS: "off"
      CRAWL_ON_START: "0"
      CRAWL_PAGES: "1"
      MYSQL_HOST: "host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8765:8765"
    volumes:
      - ./.env:/app/.env:ro
      - ./data/sessions:/app/data/sessions
      - ./data/web:/app/data/web
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
