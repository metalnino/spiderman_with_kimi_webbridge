# Synology Container Manager / docker compose
# MySQL 用现有库（.env 里 MYSQL_*），不在此起库
services:
  spiderman:
    build: .
    image: spiderman-ledger:local
    pull_policy: build
    container_name: spiderman_ledger
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: "Asia/Shanghai"
      LEDGER_HOST: "0.0.0.0"
      LEDGER_PORT: "8765"
      CRAWL_CRON_HOURS: "8,12,18,22"
      CRAWL_ON_START: "0"
      CRAWL_PAGES: "1"
      # 若容器内解析不到公网域名，把 MYSQL_HOST 改成 NAS 局域网 IP 或 host.docker.internal
      # MYSQL_HOST: "192.168.x.x"
    ports:
      - "8765:8765"
    volumes:
      - ./.env:/app/.env:ro
      - ./data/sessions:/app/data/sessions
      - ./data/web:/app/data/web
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
