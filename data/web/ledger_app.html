<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>绿植招采运营台</title>
<style>
body{font-family:Microsoft YaHei,Segoe UI,sans-serif;margin:0;background:#f5f6f8;color:#1f2329}
header{background:#111827;color:#fff;padding:16px 24px}
nav{display:flex;gap:8px;padding:12px 24px;background:#fff;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}
nav button{border:1px solid #d1d5db;background:#fff;padding:8px 12px;cursor:pointer;border-radius:4px}
nav button.active{background:#111827;color:#fff;border-color:#111827}
section{display:none;padding:20px 24px}
section.active{display:block}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid #e5e7eb;padding:6px 8px;font-size:13px;vertical-align:top}
th{background:#f3f4f6;text-align:left;position:sticky;top:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.hint{color:#6b7280;font-size:12px}
.cards{display:flex;gap:12px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #e5e7eb;padding:12px 16px;min-width:140px;border-radius:6px}
.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:8px 12px;margin:12px 24px;border-radius:6px}
.pager{display:flex;gap:8px;align-items:center;margin-top:10px}
button.secondary{border:1px solid #d1d5db;background:#fff;padding:6px 10px;cursor:pointer;border-radius:4px}
button.secondary:hover{background:#f3f4f6}
button.primary{background:#111827;color:#fff;border:1px solid #111827;padding:6px 12px;cursor:pointer;border-radius:4px}
input[type=text],input[type=number],select{padding:6px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:13px}
mark{background:#fde68a;padding:0 2px;border-radius:2px}
select.lead-sel{border:none;background:#f3f4f6;font-size:12px;padding:2px 4px;border-radius:4px;cursor:pointer}
input.remark{font-size:12px;padding:2px 4px;border:1px solid transparent;width:110px}
input.remark:focus{border-color:#d1d5db;background:#fff}
.unread{font-weight:650;color:#111827}
.read{color:#9ca3af}
.tag{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:4px;padding:0 4px;font-size:11px;margin:1px}
a{color:#2563eb;text-decoration:none}
a:hover{text-decoration:underline}
/* P4 详情抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:94vw;background:#fff;z-index:41;
  box-shadow:-6px 0 24px rgba(0,0,0,.18);display:flex;flex-direction:column}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:14px 16px;border-bottom:1px solid #e5e7eb;background:#f9fafb}
.drawer-body{flex:1;overflow-y:auto;padding:14px 16px}
.dl{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:13px}
.dl dt{color:#6b7280;text-align:right}
.dl dd{margin:0;word-break:break-all}
.tl{list-style:none;margin:8px 0 0;padding:0;border-left:2px solid #e5e7eb}
.tl li{padding:4px 0 4px 12px;position:relative;font-size:13px}
.tl li:before{content:'';position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:50%;background:#9ca3af}
.tl li.cur:before{background:#2563eb}
.tl li.cur{font-weight:650}
.summary-box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:10px 12px;margin-top:8px;
  white-space:pre-wrap;font-size:13px;max-height:220px;overflow-y:auto}
.detail-err{color:#b91c1c;font-size:12px;margin-top:6px}
.row-title{cursor:pointer}
.row-title:hover{text-decoration:underline;color:#2563eb}
</style>
</head>
<body>
<header><h1>绿植招采运营台</h1><div class="hint" id="hdrHint">加载中…</div></header>
<div id="errBox" class="error" style="display:none"></div>
<nav>
  <button class="active" data-tab="monitor">运行监控</button>
  <button data-tab="leads">线索工作台</button>
  <button data-tab="clean">清洗质量</button>
  <button data-tab="kw">词库</button>
  <button data-tab="captcha">验证码待办</button>
  <button data-tab="crm">CRM主体</button>
</nav>

<section id="monitor" class="active">
  <div style="margin-bottom:12px"><button class="primary" id="crawlNow">▶ 立即爬取一次</button> <span class="hint" id="crawlMsg"></span></div>
  <div class="cards" id="sumCards"></div>
  <h3>最近任务</h3>
  <table><thead><tr><th>ID</th><th>源站</th><th>状态</th><th>条数</th><th>开始</th><th>备注</th></tr></thead>
  <tbody id="runBody"></tbody></table>
</section>

<section id="leads">
  <h2>线索工作台</h2>
  <div class="filters">
    <label>源站 <select id="lSource"><option value="">全部</option></select></label>
    <label>省 <select id="lProv"><option value="">全部</option></select></label>
    <label>市 <select id="lCity"><option value="">全部</option></select></label>
    <label>处理状态 <select id="lLead"><option value="">全部</option><option>待处理</option><option>跟进中</option><option>已成交</option><option>已放弃</option><option>忽略</option></select></label>
    <label>阶段 <select id="lStage"><option value="">全部</option></select></label>
    <label>金额 <input type="number" id="lAmtMin" placeholder="最小(元)" style="width:90px"/> - <input type="number" id="lAmtMax" placeholder="最大(元)" style="width:90px"/></label>
    <label>标题 <input type="text" id="lQ" placeholder="关键词"/></label>
    <label>排序 <select id="lSort"><option value="created">按发现时间</option><option value="amount">按金额</option><option value="publish">按发布时间</option></select></label>
    <label><input type="checkbox" id="lTarget" checked/> 仅目标城市</label>
    <label><input type="checkbox" id="lPass"/> 仅通过</label>
    <button class="primary" id="lSearch">查询</button>
    <button class="secondary" id="lExport">导出CSV</button>
  </div>
  <table><thead><tr>
    <th>已读</th><th>NEW</th><th>源站</th><th>城市</th><th>处理状态</th><th>金额</th><th>金额确认</th><th>标题 / 招标人</th><th>发布时间</th><th>发现时间</th><th>备注</th>
  </tr></thead><tbody id="leadBody"></tbody></table>
  <div class="pager"><button class="secondary" id="lPrev">上一页</button><span id="lPage" class="hint"></span><button class="secondary" id="lNext">下一页</button></div>
</section>

<section id="clean">
  <h2>清洗质量</h2>
  <div class="cards"><div class="card"><b>近7日决策</b><ul id="cleanDec"></ul></div>
  <div class="card"><b>丢弃原因 Top</b><ul id="cleanDrop"></ul></div></div>
</section>

<section id="kw">
  <h2>词库（页面可改，改动落库并回写配置）</h2>
  <div class="filters">
    <input type="text" id="kwNew" placeholder="新增关键词" style="width:180px"/>
    <button class="primary" id="kwAdd">新增</button>
    <span class="hint" id="kwMsg"></span>
  </div>
  <table><thead><tr><th>关键词</th><th>状态</th><th>分组</th><th>操作</th></tr></thead><tbody id="kwBody"></tbody></table>
</section>

<section id="captcha">
  <h2>验证码待办（本机同事划）</h2>
  <p class="hint">流程：点「打开」→ 浏览器里划/输验证码 → 点「已解决」。</p>
  <p class="hint" id="capMsg"></p>
  <table><thead><tr><th>ID</th><th>源站</th><th>状态</th><th>标题</th><th>Cookie</th><th>操作</th></tr></thead>
  <tbody id="capBody"></tbody></table>
</section>

<section id="crm">
  <h2>CRM 主体（规范化去重 / 全国同名合并）</h2>
  <table><thead><tr><th>名称</th><th>类型</th><th>主城</th><th>业务</th><th>公告数</th><th>最近</th></tr></thead>
  <tbody id="crmBody"></tbody></table>
</section>

<div id="drawerMask" class="drawer-mask" style="display:none"></div>
<aside id="drawer" class="drawer" style="display:none">
  <div class="drawer-head">
    <div><b id="dTitle"></b><div class="hint" id="dStage"></div></div>
    <button class="secondary" id="dClose">✕ 关闭</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
</aside>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let META = {province_city:{}, sources:[], hints:{}};
let lOffset = 0;
const PAGE = 50;

async function api(path) {
  const r = await fetch(path, {cache:'no-store'});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || j.detail || ('HTTP '+r.status));
  return j;
}
async function postJSON(path, body) {
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok && !j.ok) throw new Error(j.error || j.detail || ('HTTP '+r.status));
  return j;
}
async function del(path) {
  const r = await fetch(path, {method:'DELETE'});
  const j = await r.json();
  if (!r.ok && !j.ok) throw new Error(j.error || j.detail || ('HTTP '+r.status));
  return j;
}
function showErr(e) {
  const box = document.getElementById('errBox');
  box.style.display = 'block';
  box.textContent = 'API 错误: ' + (e && e.message ? e.message : e) + '（请确认 python scripts/jobs/serve_ledger.py 已启动）';
}
function fillSelect(sel, arr) {
  sel.innerHTML = '<option value="">全部</option>' + arr.map(s => '<option value="'+esc(s)+'">'+esc(s)+'</option>').join('');
}
function fmtAmount(r) {
  if (r.amount_text) return esc(r.amount_text);
  if (r.amount != null) {
    const a = Number(r.amount);
    if (a >= 10000) return (a/10000).toFixed(2) + '万';
    return a + '元';
  }
  return '-';
}
function hlTitle(title, kw) {
  if (!kw || !title) return esc(title);
  const i = title.indexOf(kw);
  if (i < 0) return esc(title);
  return esc(title.slice(0,i)) + '<mark>'+esc(kw)+'</mark>' + esc(title.slice(i+kw.length));
}

async function loadMonitor() {
  const [sum, runs] = await Promise.all([api('/api/summary'), api('/api/runs?limit=40')]);
  document.getElementById('hdrHint').textContent =
    sum.generated_at+' · 公告 '+sum.notice_total+' · NEW(48h) '+sum.recent_new+' · 任务 '+sum.run_total;
  document.getElementById('sumCards').innerHTML = [
    ['公告总数', sum.notice_total],['近48h新增', sum.recent_new],['任务数', sum.run_total],
    ['CRM主体', sum.entity_total],['验证码待办', sum.open_captcha],
  ].map(([k,v]) => '<div class="card"><div class="hint">'+esc(k)+'</div><b>'+esc(v)+'</b></div>').join('');
  document.getElementById('runBody').innerHTML = (runs.items||[]).map(r =>
    '<tr><td>'+esc(r.id)+'</td><td>'+esc(r.source_id)+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.item_count)+'</td><td>'+esc(r.started_at)+'</td><td>'+esc((r.note||'').slice(0,80))+'</td></tr>'
  ).join('') || '<tr><td colspan=6>暂无</td></tr>';
}

const LEAD_STATUSES = ['待处理','跟进中','已成交','已放弃','忽略'];
const AMOUNT_STATUSES = ['待确认','已确认','无金额'];

function leadSelect(cur, opts, cls, dataId, act) {
  let h = '<select class="'+cls+'" data-id="'+dataId+'" data-act="'+act+'">';
  if (opts.indexOf(cur) < 0) h += '<option value="'+esc(cur||'')+'" selected>'+esc(cur||'')+'</option>';
  for (const o of opts) h += '<option value="'+esc(o)+'"'+(o===cur?' selected':'')+'>'+esc(o)+'</option>';
  return h + '</select>';
}

async function loadLeads() {
  const qs = new URLSearchParams({limit:String(PAGE), offset:String(lOffset)});
  const src=document.getElementById('lSource').value, prov=document.getElementById('lProv').value,
        city=document.getElementById('lCity').value, lead=document.getElementById('lLead').value,
        amn=document.getElementById('lAmtMin').value, amx=document.getElementById('lAmtMax').value,
        q=document.getElementById('lQ').value.trim(), sort=document.getElementById('lSort').value,
        pass=document.getElementById('lPass').checked, target=document.getElementById('lTarget').checked,
        stage=document.getElementById('lStage').value;
  if (src) qs.set('source_id', src);
  if (prov) qs.set('province', prov);
  if (city) qs.set('city', city);
  if (lead) qs.set('lead_status', lead);
  if (stage) qs.set('stage', stage);
  if (amn) qs.set('amount_min', amn);
  if (amx) qs.set('amount_max', amx);
  if (q) qs.set('q', q);
  qs.set('sort', sort);
  if (pass) qs.set('only_pass','1');
  if (target) qs.set('target_only','1');
  const d = await api('/api/notices?'+qs.toString());
  document.getElementById('leadBody').innerHTML = (d.items||[]).map(r => {
    const readCls = r.read_at ? 'read' : 'unread';
    const readBtn = '<button class="secondary" data-id="'+r.id+'" data-act="read" style="font-size:11px;padding:2px 6px">'+(r.read_at?'已读':'标已读')+'</button>';
    const links = [];
    if (r.detail_url) links.push('<a href="'+esc(r.detail_url)+'" target="_blank">详情</a>');
    if (r.official_url && r.official_url !== r.detail_url) links.push('<a href="'+esc(r.official_url)+'" target="_blank">原文</a>');
    const buyer = r.buyer ? '<br><small class="hint">招标人：'+esc(r.buyer)+'</small>' : '';
    let multi = '';
    if (r.dup_count) {
      const srcs = (r.sources||[]).join('/');
      const dupRows = (r.duplicates||[]).map(m => {
        const dl = m.detail_url ? '<a href="'+esc(m.detail_url)+'" target="_blank">详情</a>' : '-';
        return '<div class="hint">'+esc(m.source_id||'')+' · '+esc(m.publish_date||'-')+' · '+dl+'</div>';
      }).join('');
      multi = '<br><small class="hint">'+r.dup_count+'源('+esc(srcs)+') <a href="#" class="dup-toggle" data-id="'+r.id+'">各源▾</a></small>'
            + '<div id="dupbox-'+r.id+'" style="display:none;margin-top:2px">'+dupRows+'</div>';
    }
    return '<tr class="'+readCls+'">'
      + '<td>'+readBtn+'</td>'
      + '<td>'+(r.is_new?'NEW':'')+'</td>'
      + '<td>'+esc(r.source_id)+'</td>'
      + '<td>'+esc(r.city||'-')+'</td>'
      + '<td>'+leadSelect(r.lead_status||'待处理', LEAD_STATUSES, 'lead-sel', r.id, 'lead')+'</td>'
      + '<td>'+fmtAmount(r)+'</td>'
      + '<td>'+leadSelect(r.amount_status||(r.amount!=null?'待确认':'无金额'), AMOUNT_STATUSES, 'lead-sel', r.id, 'amount')+'</td>'
      + '<td><span class="row-title" data-id="'+r.id+'">'+hlTitle(r.title, r.keyword)+'</span>'
      + ' <span class="tag">'+esc(r.stage_label||'其他')+'</span>'
      + multi + buyer + ' <br><small class="hint">'+links.join(' · ')+'</small></td>'
      + '<td>'+esc(r.publish_date||'-')+'</td>'
      + '<td>'+esc(r.created_at)+'</td>'
      + '<td><input class="remark" data-id="'+r.id+'" data-act="remark" value="'+esc(r.remark||'')+'" placeholder="备注"/></td>'
      + '</tr>';
  }).join('') || '<tr><td colspan=11>暂无数据</td></tr>';
  document.getElementById('lPage').textContent = '共 '+d.total+' · offset '+d.offset+(d.truncated?' · 数据量超出折叠上限':'');
  document.getElementById('lPrev').disabled = lOffset <= 0;
  document.getElementById('lNext').disabled = lOffset + PAGE >= d.total;
}

async function loadClean() {
  const s = await api('/api/clean/stats');
  document.getElementById('cleanDec').innerHTML = (s.decisions_7d||[]).map(x => '<li>'+esc(x.decision)+': '+esc(x.c)+'</li>').join('') || '<li>暂无</li>';
  document.getElementById('cleanDrop').innerHTML = (s.drop_reasons||[]).map(x => '<li>'+esc(x.reason||'-')+': '+esc(x.c)+'</li>').join('') || '<li>暂无</li>';
}

async function loadKw() {
  const d = await api('/api/keywords');
  document.getElementById('kwBody').innerHTML = (d.items||[]).map(k =>
    '<tr><td>'+esc(k.keyword)+'</td><td>'+(k.enabled?'<b style="color:#0d7a3f">启用</b>':'<span class="hint">停用</span>')+'</td><td>'+esc(k.group_name||'-')+'</td>'
    + '<td><button class="secondary" data-kw="'+esc(k.keyword)+'" data-act="toggle">'+(k.enabled?'停用':'启用')+'</button> '
    + '<button class="secondary" data-kw="'+esc(k.keyword)+'" data-act="del" style="color:#b91c1c">删除</button></td></tr>'
  ).join('') || '<tr><td colspan=4>请先 seed</td></tr>';
  document.getElementById('kwBody').onclick = async (ev) => {
    const btn = ev.target.closest('button[data-kw]');
    if (!btn) return;
    const kw = btn.dataset.kw, msg = document.getElementById('kwMsg');
    try {
      if (btn.dataset.act === 'toggle') {
        const cur = btn.textContent.trim() === '停用';
        await postJSON('/api/keywords/'+encodeURIComponent(kw)+'/toggle', {enabled: !cur});
      } else {
        await del('/api/keywords/'+encodeURIComponent(kw));
      }
      msg.textContent = '已更新';
      await loadKw();
    } catch (e) { showErr(e); }
  };
}

async function loadCaptcha() {
  const d = await api('/api/captcha?limit=40');
  document.getElementById('capBody').innerHTML = (d.items||[]).map(t => {
    const openBtn = t.status==='open' ? '<button class="secondary" data-act="open" data-id="'+t.id+'">打开</button>' : '';
    const doneBtn = t.status==='open' ? '<button class="secondary" data-act="done" data-id="'+t.id+'">已解决</button>' : '';
    const link = t.detail_url ? '<a href="'+esc(t.detail_url)+'" target="_blank">链接</a>' : '';
    const ck = t.has_saved_cookie ? '有('+esc(t.cookie_saved_at||'')+')' : '无';
    return '<tr><td>'+esc(t.id)+'</td><td>'+esc(t.source_id)+'</td><td>'+esc(t.status)+'</td><td>'+esc((t.title||'').slice(0,80))+' '+link+'</td><td>'+ck+'</td><td>'+openBtn+' '+doneBtn+'</td></tr>';
  }).join('') || '<tr><td colspan=6>暂无</td></tr>';
  document.getElementById('capBody').onclick = async (ev) => {
    const btn = ev.target.closest('button[data-act]');
    if (!btn) return;
    const id = Number(btn.dataset.id), msg = document.getElementById('capMsg');
    try {
      if (btn.dataset.act === 'open') { const out = await postJSON('/api/captcha/open', {id}); msg.textContent = out.instruction || '已打开'; }
      else { const out = await postJSON('/api/captcha/done', {id}); msg.textContent = out.cookie_saved ? '已保存 Cookie' : (out.warning||'已关闭'); }
      await loadCaptcha();
    } catch (e) { showErr(e); }
  };
}

async function loadCrm() {
  const d = await api('/api/entities?limit=100');
  document.getElementById('crmBody').innerHTML = (d.items||[]).map(e => {
    const tags = (e.service_tags||[]).map(t => '<span class="tag">'+esc(t.k)+'×'+esc(t.n)+'</span>').join('') || '-';
    return '<tr><td>'+esc(e.name)+'</td><td>'+esc(e.entity_type||'-')+'</td><td>'+esc(e.city||'-')+'</td><td>'+tags+'</td><td>'+esc(e.notice_count)+'</td><td>'+esc(e.last_notice_at||'-')+'</td></tr>';
  }).join('') || '<tr><td colspan=6>暂无</td></tr>';
}

// ---------- P4 详情抽屉 ----------
let dNoticeId = null;
function fmtDateTime(v) { return v ? esc(v) : '-'; }
function closeDrawer() {
  document.getElementById('drawer').style.display = 'none';
  document.getElementById('drawerMask').style.display = 'none';
  dNoticeId = null;
}
async function openDrawer(id) {
  dNoticeId = id;
  document.getElementById('drawer').style.display = 'flex';
  document.getElementById('drawerMask').style.display = 'block';
  document.getElementById('dTitle').textContent = '加载中…';
  document.getElementById('dStage').textContent = '';
  document.getElementById('dBody').innerHTML = '';
  try {
    const d = await api('/api/notices/'+id);
    renderDrawer(d);
  } catch (e) { showErr(e); }
}
function dlRow(k, v) { return '<dt>'+esc(k)+'</dt><dd>'+v+'</dd>'; }
function renderDrawer(d) {
  const n = d.notice || {};
  document.getElementById('dTitle').textContent = n.title || '';
  document.getElementById('dStage').textContent =
    '阶段：'+(n.stage_label||'其他')+' · 源站：'+(n.source_id||'-')+' · 入库：'+(n.created_at||'-');
  const links = [];
  if (n.detail_url) links.push('<a href="'+esc(n.detail_url)+'" target="_blank">详情页</a>');
  if (n.official_url && n.official_url !== n.detail_url) links.push('<a href="'+esc(n.official_url)+'" target="_blank">原文</a>');
  let fields = '<h3>基本信息</h3><dl class="dl">';
  fields += dlRow('城市', fmtDateTime(n.city||''));
  fields += dlRow('省份', fmtDateTime(n.province||''));
  fields += dlRow('地区', fmtDateTime(n.region_text||''));
  fields += dlRow('发布时间', fmtDateTime(n.publish_date||''));
  fields += dlRow('开标时间', fmtDateTime(n.open_time||''));
  fields += dlRow('截止时间', fmtDateTime(n.deadline||''));
  fields += dlRow('公告类型', fmtDateTime(n.notice_type||''));
  fields += dlRow('投标状态', fmtDateTime(n.bid_status||''));
  fields += dlRow('金额', fmtAmount(n));
  fields += dlRow('金额确认', fmtDateTime(n.amount_status||''));
  fields += dlRow('招标人', fmtDateTime(n.buyer||''));
  fields += dlRow('代理机构', fmtDateTime(n.agency||''));
  fields += dlRow('项目编号', fmtDateTime(n.project_code||''));
  fields += dlRow('关键词', fmtDateTime(n.keyword||''));
  fields += dlRow('清洗状态', fmtDateTime((n.clean_status||'-')+(n.clean_reason?' ('+n.clean_reason+')':'')));
  fields += dlRow('项目名', fmtDateTime(n.project_name||''));
  fields += dlRow('原文链接', links.join(' · ') || '-');
  fields += '</dl>';

  let crm = '<h3>运营操作</h3><div class="dl">'
    + dlRow('处理状态', leadSelect(n.lead_status||'待处理', LEAD_STATUSES, 'lead-sel', n.id, 'lead'))
    + dlRow('金额确认', leadSelect(n.amount_status||(n.amount!=null?'待确认':'无金额'), AMOUNT_STATUSES, 'lead-sel', n.id, 'amount'))
    + dlRow('备注', '<input class="remark" data-id="'+n.id+'" data-act="remark" value="'+esc(n.remark||'')+'" placeholder="备注"/>')
    + dlRow('已读', (n.read_at ? '已读 '+esc(n.read_at) : '<button class="secondary" data-id="'+n.id+'" data-act="read" style="font-size:11px">标已读</button>'))
    + '</div>';

  let backfill = '<h3>详情回填</h3><button class="primary" id="dBackfill">▶ 按需回填本条</button>'
    + '<div id="dBackfillMsg" class="hint"></div>';
  if (n.detail_status) {
    const ok = n.detail_status === 'ok';
    backfill += '<div class="hint" style="margin-top:4px">最近回填：<b style="color:'+(ok?'#0d7a3f':'#b91c1c')+'">'+esc(n.detail_status)+'</b></div>';
  }
  if (n.summary) {
    backfill += '<div class="summary-box"><b>正文摘要</b><br>'+esc(n.summary)+'</div>';
  }
  if (n.tenderfile_path) {
    backfill += '<div style="margin-top:6px"><a href="/api/notices/'+n.id+'/tenderfile" target="_blank">📎 下载附件（已提取正文）</a></div>';
  }

  let tl = '';
  if ((d.timeline||[]).length > 1) {
    const items = d.timeline.map(t => {
      const cur = t.id === n.id ? ' class="cur"' : '';
      const lnk = t.detail_url ? ' <a href="'+esc(t.detail_url)+'" target="_blank" style="font-size:11px">原文</a>' : '';
      const open = '<a href="#" class="tl-open" data-id="'+t.id+'" style="font-size:11px">打开</a>';
      return '<li'+cur+'>['+esc(t.stage_label||'其他')+'] '+esc(t.publish_date||'-')+' · '+esc(t.source_id)+' · '+esc((t.title||'').slice(0,46))+' '+open+lnk+'</li>';
    }).join('');
    tl = '<h3>项目时间线（'+(d.timeline||[]).length+' 条）</h3><ul class="tl">'+items+'</ul>';
  }
  document.getElementById('dBody').innerHTML = fields + crm + backfill + tl;
  document.getElementById('dBody').onclick = async (ev) => {
    const tlA = ev.target.closest('a.tl-open');
    if (tlA) { ev.preventDefault(); openDrawer(Number(tlA.dataset.id)); return; }
    const btn = ev.target.closest('button[data-act="read"]');
    if (btn) {
      try {
        await postJSON('/api/notices/'+Number(btn.dataset.id)+'/lead', {read:true});
        await openDrawer(Number(btn.dataset.id));
        loadLeads().catch(showErr);
      } catch (e) { showErr(e); }
      return;
    }
    const bk = ev.target.closest('#dBackfill');
    if (bk) {
      const msg = document.getElementById('dBackfillMsg');
      bk.disabled = true; msg.textContent = '回填中…（桥源站可能需要 10-60 秒，请勿重复点击）';
      try {
        const out = await postJSON('/api/notices/'+dNoticeId+'/backfill', {});
        if (out.ok) {
          msg.textContent = '回填成功：'+(out.fields ? Object.keys(out.fields).join('/') : (out.summary ? '已提取正文摘要' : ''));
          await openDrawer(dNoticeId);
          loadLeads().catch(showErr);
        } else {
          msg.textContent = '回填失败（如实记录）：'+(out.error||'');
          await openDrawer(dNoticeId);
        }
      } catch (e) { msg.textContent = '回填失败：'+e.message; bk.disabled = false; }
    }
  };
}

function refillCities() {
  const p = document.getElementById('lProv').value;
  const city = document.getElementById('lCity');
  const keep = city.value, list = META.province_city[p] || [];
  city.innerHTML = '<option value="">全部</option>' + list.map(c => '<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
  if (list.includes(keep)) city.value = keep;
}

const loaders = {monitor:loadMonitor, leads:loadLeads, clean:loadClean, kw:loadKw, captcha:loadCaptcha, crm:loadCrm};

async function boot() {
  try {
    META = await api('/api/meta');
    fillSelect(document.getElementById('lSource'), META.sources);
    const sEl = document.getElementById('lStage');
    sEl.innerHTML = '<option value="">全部</option>' + (META.stages||[]).map(s => '<option value="'+esc(s.key)+'">'+esc(s.label)+'</option>').join('');
    const prov = document.getElementById('lProv');
    prov.innerHTML = '<option value="">全部</option>' + Object.keys(META.province_city||{}).map(p => '<option value="'+esc(p)+'">'+esc(p)+'</option>').join('');
    await loadMonitor();
  } catch (e) { showErr(e); }
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = async () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    try { await loaders[btn.dataset.tab](); } catch (e) { showErr(e); }
  };
});

document.getElementById('lSearch').onclick = () => { lOffset = 0; loadLeads().catch(showErr); };
document.getElementById('lPrev').onclick = () => { lOffset = Math.max(0, lOffset - PAGE); loadLeads().catch(showErr); };
document.getElementById('lNext').onclick = () => { lOffset += PAGE; loadLeads().catch(showErr); };
document.getElementById('lProv').onchange = refillCities;
document.getElementById('lExport').onclick = () => {
  const qs = new URLSearchParams();
  const src=document.getElementById('lSource').value, lead=document.getElementById('lLead').value, q=document.getElementById('lQ').value.trim();
  if (src) qs.set('source_id', src);
  if (lead) qs.set('lead_status', lead);
  if (q) qs.set('q', q);
  if (document.getElementById('lStage').value) qs.set('stage', document.getElementById('lStage').value);
  if (document.getElementById('lPass').checked) qs.set('only_pass','1');
  if (document.getElementById('lTarget').checked) qs.set('target_only','1');
  qs.set('sort', document.getElementById('lSort').value);
  window.open('/api/notices/export?'+qs.toString(), '_blank');
};
document.getElementById('crawlNow').onclick = async () => {
  const msg = document.getElementById('crawlMsg');
  try {
    const out = await postJSON('/api/crawl/run', {pages: 1});
    msg.textContent = out.triggered ? ('已触发爬取 (pid='+out.pid+')，稍后刷新看结果') : (out.error || '未触发');
    setTimeout(() => loadMonitor().catch(showErr), 3000);
  } catch (e) { showErr(e); }
};
document.getElementById('kwAdd').onclick = async () => {
  const inp = document.getElementById('kwNew'), msg = document.getElementById('kwMsg');
  const v = inp.value.trim();
  if (!v) return;
  try { await postJSON('/api/keywords', {keyword: v}); inp.value=''; msg.textContent='已新增 '+v; await loadKw(); }
  catch (e) { showErr(e); }
};
document.getElementById('leadBody').addEventListener('change', async (ev) => {
  const t = ev.target;
  if (t.classList.contains('lead-sel')) {
    const id = Number(t.dataset.id), act = t.dataset.act, body = {id};
    if (act === 'lead') body.lead_status = t.value;
    else if (act === 'amount') body.amount_status = t.value;
    try { await postJSON('/api/notices/'+id+'/lead', body); } catch (e) { showErr(e); }
  }
  if (t.classList.contains('remark')) {
    try { await postJSON('/api/notices/'+Number(t.dataset.id)+'/lead', {remark: t.value}); } catch (e) { showErr(e); }
  }
});
document.getElementById('leadBody').addEventListener('click', async (ev) => {
  const rt = ev.target.closest('.row-title');
  if (rt) { openDrawer(Number(rt.dataset.id)); return; }
  const dt = ev.target.closest('.dup-toggle');
  if (dt) {
    ev.preventDefault();
    const box = document.getElementById('dupbox-'+dt.dataset.id);
    if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
    return;
  }
  const btn = ev.target.closest('button[data-act="read"]');
  if (!btn) return;
  try { await postJSON('/api/notices/'+Number(btn.dataset.id)+'/lead', {read: true}); loadLeads().catch(showErr); }
  catch (e) { showErr(e); }
});
document.getElementById('dClose').onclick = closeDrawer;
document.getElementById('drawerMask').onclick = closeDrawer;
// 抽屉内 CRM 控件：一次性事件委托（change 不冒泡到 onclick，需独立监听且只挂一次）
document.getElementById('dBody').addEventListener('change', async (ev) => {
  const t = ev.target;
  if (t.classList.contains('lead-sel')) {
    const id = Number(t.dataset.id), act = t.dataset.act, body = {id};
    if (act === 'lead') body.lead_status = t.value;
    else if (act === 'amount') body.amount_status = t.value;
    try { await postJSON('/api/notices/'+id+'/lead', body); loadLeads().catch(showErr); } catch (e) { showErr(e); }
  }
  if (t.classList.contains('remark')) {
    try { await postJSON('/api/notices/'+Number(t.dataset.id)+'/lead', {remark: t.value}); loadLeads().catch(showErr); } catch (e) { showErr(e); }
  }
});

boot();
</script>
</body>
